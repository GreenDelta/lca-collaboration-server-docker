services:
  server:
    image: registry.greendelta.com/hub/collaboration-server:latest
    container_name: lcacollab
    ports:
      - 8080:8080
    environment:
      - SERVER_URL
      - DATABASE_URL
      - DATABASE_USER
      - DATABASE_PASSWORD
    volumes:
      - server:/opt/collab
      - type: tmpfs
        target: /usr/local/tomcat/logs
      - type: tmpfs
        target: /home/collab/.config
    read_only: true
volumes:
  server:
    name: lcacollab-server
