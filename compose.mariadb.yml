services:
  db-standalone:
    image: mariadb:12.3
    container_name: lcacollab-db
    ports:
      - 3306:3306
    environment:
      - MARIADB_ROOT_PASSWORD
      - MARIADB_DATABASE
      - MARIADB_USER
      - MARIADB_PASSWORD
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    volumes:
      - db:/var/lib/mysql
volumes:
  db:
    name: lcacollab-db
